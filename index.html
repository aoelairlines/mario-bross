<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pixel Coin Adventure — Game Arcade 2D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    touch-action: manipulation;
  }
  h1 { letter-spacing: 4px; margin-bottom: 8px; text-transform: uppercase; font-size: 1.2rem; }
  #gameContainer {
    position: relative;
    border: 4px solid #ffd700;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
    border-radius: 6px;
    overflow: hidden;
    background: #87ceeb;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px;
  }
  #hud { display: flex; gap: 16px; font-size: 14px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: auto; }
  #hud span { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; border: 1px solid #ffd700; }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; pointer-events: auto;
  }
  .overlay.hidden { display: none !important; }
  .overlay h2 { font-size: 1.4rem; margin-bottom: 12px; text-shadow: 2px 2px #000; }
  .overlay p { margin-bottom: 16px; font-size: 0.9rem; color: #ddd; max-width: 260px; text-align: center; }
  input[type="text"] {
    font-family: inherit; font-size: 1rem; padding: 8px 12px;
    border: 2px solid #ffd700; border-radius: 4px; background: #000; color: #fff;
    max-width: 200px; text-align: center; text-transform: uppercase;
  }
  button {
    font-family: inherit; font-size: 0.95rem; padding: 10px 20px;
    border: 2px solid #ffd700; border-radius: 4px; background: #000; color: #fff;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: #ffd700; color: #000; transform: scale(1.05); }
  button:active { transform: scale(0.95); }
  button.secondary { border-color: #4ecdc4; color: #4ecdc4; background: transparent; }
  button.secondary:hover { background: #4ecdc4; color: #000; }
  table { border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
  th, td { border: 1px solid #444; padding: 4px 8px; text-align: center; }
  th { background: #ffd700; color: #000; font-weight: bold; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.05); }
  #touchControls {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; pointer-events: none;
  }
  .d-pad { pointer-events: auto; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
  .d-pad button { width: 44px; height: 44px; padding: 0; font-size: 1.4rem; line-height: 1; display: flex; align-items: center; justify-content: center; }
  #btnLeft { grid-column: 1; grid-row: 2; }
  #btnRight { grid-column: 3; grid-row: 2; }
  #btnJump { grid-column: 2; grid-row: 1; width: 44px; height: 44px; border-radius: 50%; }
  @media (min-width: 600px) {
    #touchControls { display: none !important; }
    canvas { width: 640px; height: 480px; }
  }
  @media (max-width: 599px) {
    canvas { width: 100%; max-width: 320px; height: auto; aspect-ratio: 4 / 3; }
    h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<h1>Pixel Coin Adventure</h1>

<div id="gameContainer">
  <canvas id="gameCanvas" width="320" height="240"></canvas>

  <div id="ui">
    <div id="hud">
      <span id="hudScore">SCORE: 0</span>
      <span id="hudCoins">COIN: 0</span>
    </div>

    <div id="menuScreen" class="overlay">
      <h2>PIXEL COIN ADVENTURE</h2>
      <div id="usernameBox" style="margin-bottom:16px; text-align:center;">
        <label style="font-size:0.85rem; color:#ffd700; display:block; margin-bottom:6px;">NAMA Pemain (1-15 karakter)</label>
        <input type="text" id="inputUsername" maxlength="15" placeholder="PLAYER1">
      </div>
      <button id="btnStart">MULAI MAIN</button>
      <button class="secondary" id="btnChangeName" style="margin-top:10px; display:none;">Ganti Nama</button>
      <p style="margin-top:16px;">Panah / WASD = Gerak &nbsp;|&nbsp; Spasi / ↑ = Lompat</p>
    </div>

    <div id="gameoverScreen" class="overlay hidden">
      <h2 style="color:#ff4444;">GAME OVER</h2>
      <p id="finalScore">Skor Akhir: 0</p>
      <button id="btnRetry">COBA LAGI</button>
      <button class="secondary" id="btnMenu">KE MENU</button>
    </div>

    <div id="leaderboardScreen" class="overlay hidden">
      <h2 style="color:#4ecdc4;">LEADERBOARD TOP 10</h2>
      <table id="leaderboardTable">
        <thead><tr><th>#</th><th>Nama</th><th>Skor</th><th>Tanggal</th></tr></thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
      <div style="text-align:center;">
        <button id="btnLeaderboardMenu">KE MENU UTAMA</button>
      </div>
    </div>
  </div>

  <div id="touchControls">
    <div class="d-pad">
      <button id="btnLeft">◀</button>
      <button id="btnJump">↑</button>
      <button id="btnRight">▶</button>
    </div>
  </div>
</div>
<script>
/* ============================================================
   1. CONFIG & CANVAS SETUP
   ============================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const INTERNAL_W = 320;
const INTERNAL_H = 240;
const TILE = 16;
const GRAVITY = 0.28;
const FRICTION = 0.82;
const ACCEL = 0.18;
const MAX_SPEED = 3.2;
const JUMP_FORCE = -5.0;
const LEVEL_WIDTH = 1408;
const GROUND_Y = INTERNAL_H - TILE;

let cameraX = 0;
let frameCount = 0;

/* ============================================================
   2. AUDIO SYNTHESIS (Web Audio API)
   ============================================================ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(type, freq, duration, vol = 0.1) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function sfxJump()    { ensureAudio(); playTone('square', 440, 0.12, 0.12); playTone('square', 554, 0.12, 0.08); }
function sfxCoin()    { ensureAudio(); playTone('triangle', 988, 0.1, 0.15); playTone('triangle', 1320, 0.1, 0.1); }
function sfxStomp()   { ensureAudio(); playTone('sawtooth', 220, 0.15, 0.15); playTone('sawtooth', 110, 0.15, 0.1); }
function sfxHit()     { ensureAudio(); playTone('sawtooth', 150, 0.25, 0.2); playTone('sawtooth', 100, 0.25, 0.15); }
function sfxGameOver(){ ensureAudio(); playTone('sawtooth', 120, 0.4, 0.25); playTone('sawtooth', 80, 0.4, 0.2); }

/* ============================================================
   3. INPUT HANDLING
   ============================================================ */
const keys = {};
window.addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(e.code) || ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.code] = true;
  keys[e.key] = true;
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  keys[e.key] = false;
});

function isPressed(key) { return !!keys[key]; }

const touch = { left:false, right:false, jump:false };
function bindTouch(id, onPress, onRelease) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); onPress(); }, {passive:false});
  el.addEventListener('mousedown', e => { e.preventDefault(); onPress(); });
  el.addEventListener('touchend', e => { e.preventDefault(); onRelease(); });
  el.addEventListener('mouseup', e => { e.preventDefault(); onRelease(); });
  el.addEventListener('mouseleave', onRelease);
}
bindTouch('btnLeft', () => touch.left = true, () => touch.left = false);
bindTouch('btnRight', () => touch.right = true, () => touch.right = false);
bindTouch('btnJump', () => touch.jump = true, () => touch.jump = false);
/* ============================================================
   4. GAME STATE & ENTITIES
   ============================================================ */
const STATE_MENU = 'MENU';
const STATE_PLAYING = 'PLAYING';
const STATE_GAMEOVER = 'GAMEOVER';
const STATE_LEADERBOARD = 'LEADERBOARD';

let gameState = STATE_MENU;
let score = 0;
let coins = 0;
let username = localStorage.getItem('arcade_last_username') || '';

const player = {
  x: 40, y: GROUND_Y - 24, w: 12, h: 20,
  vx: 0, vy: 0,
  grounded: false,
  dir: 1,
  animFrame: 0,
  alive: true,
  invuln: 0
};

const entities = {
  blocks: [],
  coins: [],
  monsters: [],
  particles: []
};

function buildLevel() {
  entities.blocks = [];
  entities.coins = [];
  entities.monsters = [];
  entities.particles = [];

  for (let x = 0; x < LEVEL_WIDTH; x += TILE) {
    entities.blocks.push({x, y: GROUND_Y, w: TILE, h: TILE, type: 'grass'});
    if (x % (TILE * 2) === 0) {
      entities.blocks.push({x, y: GROUND_Y + TILE, w: TILE, h: TILE, type: 'dirt'});
    }
  }

  const platforms = [
    {x: 200, y: 176, w: 96, h: 16},
    {x: 360, y: 144, w: 80, h: 16},
    {x: 520, y: 160, w: 96, h: 16},
    {x: 700, y: 128, w: 64, h: 16},
    {x: 860, y: 176, w: 96, h: 16},
    {x: 1040, y: 144, w: 80, h: 16},
    {x: 1200, y: 160, w: 96, h: 16},
    {x: 1350, y: 128, w: 48, h: 16}
  ];
  platforms.forEach(p => {
    for (let x = p.x; x < p.x + p.w; x += TILE) {
      entities.blocks.push({x, y: p.y, w: TILE, h: TILE, type: 'grass'});
      entities.blocks.push({x, y: p.y + TILE, w: TILE, h: TILE, type: 'dirt'});
    }
  });

  const coinPositions = [240, 272, 304, 400, 432, 560, 592, 624, 730, 760, 900, 932, 964, 1080, 1112, 1240, 1272, 1304, 1380];
  coinPositions.forEach(x => {
    entities.coins.push({x, y: 100, w: 10, h: 10, collected: false, offset: Math.random() * Math.PI * 2});
  });
  platforms.forEach(p => {
    for (let cx = p.x + 16; cx < p.x + p.w - 16; cx += 24) {
      entities.coins.push({x: cx, y: p.y - 20, w: 10, h: 10, collected: false, offset: Math.random() * Math.PI * 2});
    }
  });

  const monsterData = [
    {x: 300, y: GROUND_Y - 20, range: 96},
    {x: 560, y: 120, range: 80},
    {x: 780, y: GROUND_Y - 20, range: 112},
    {x: 1080, y: 120, range: 96},
    {x: 1260, y: GROUND_Y - 20, range: 80}
  ];
  monsterData.forEach(m => {
    entities.monsters.push({
      x: m.x, y: m.y, w: 14, h: 16,
      vx: 0.9, startX: m.x, range: m.range, type: 'slime', dir: 1, alive: true
    });
  });
}

function resetGame() {
  score = 0;
  coins = 0;
  player.x = 40;
  player.y = GROUND_Y - 24;
  player.vx = 0;
  player.vy = 0;
  player.alive = true;
  player.invuln = 0;
  cameraX = 0;
  buildLevel();
  updateHUD();
}

function spawnParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    entities.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2 - 0.5,
      life: 20 + Math.random() * 20,
      color
    });
  }
}
/* ============================================================
   5. COLLISION & PHYSICS
   ============================================================ */
function rectIntersect(r1, r2) {
  return r1.x < r2.x + r2.w &&
         r1.x + r1.w > r2.x &&
         r1.y < r2.y + r2.h &&
         r1.y + r1.h > r2.y;
}

function updatePhysics() {
  if (!player.alive) return;

  const left = isPressed('ArrowLeft') || isPressed('KeyA') || touch.left;
  const right = isPressed('ArrowRight') || isPressed('KeyD') || touch.right;
  const jump = isPressed('ArrowUp') || isPressed('KeyW') || isPressed(' ') || isPressed('Space') || touch.jump;

  if (left)  { player.vx -= ACCEL; player.dir = -1; }
  if (right) { player.vx += ACCEL; player.dir = 1; }
  if (!(left || right)) player.vx *= FRICTION;
  if (Math.abs(player.vx) < 0.05) player.vx = 0;
  if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
  if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;

  if (jump && player.grounded) {
    player.vy = JUMP_FORCE;
    player.grounded = false;
    sfxJump();
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffd700', 4);
  }

  player.vy += GRAVITY;
  if (player.vy > 7) player.vy = 7;

  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x > LEVEL_WIDTH - player.w) player.x = LEVEL_WIDTH - player.w;

  player.grounded = false;
  const playerRect = {x: player.x, y: player.y, w: player.w, h: player.h};

  entities.blocks.forEach(b => {
    if (!rectIntersect(playerRect, b)) return;
    if (player.vy > 0 && player.y + player.h - player.vy <= b.y + 2) {
      player.y = b.y - player.h;
      player.vy = 0;
      player.grounded = true;
    } else if (player.vy < 0 && player.y - player.vy >= b.y + b.h - 2) {
      player.y = b.y + b.h;
      player.vy = 0;
    } else if (player.vx > 0 && player.x + player.w - player.vx <= b.x + 2) {
      player.x = b.x - player.w;
      player.vx = 0;
    } else if (player.vx < 0 && player.x - player.vx >= b.x + b.w - 2) {
      player.x = b.x + b.w;
      player.vx = 0;
    }
  });

  if (player.y > INTERNAL_H + 40) {
    killPlayer();
  }

  cameraX = player.x - INTERNAL_W / 3;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > LEVEL_WIDTH - INTERNAL_W) cameraX = LEVEL_WIDTH - INTERNAL_W;

  entities.coins.forEach(c => {
    if (c.collected) return;
    if (rectIntersect(playerRect, c)) {
      c.collected = true;
      coins += 1;
      score += 100;
      sfxCoin();
      spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#ffd700', 5);
      updateHUD();
    }
  });

  entities.monsters.forEach(m => {
    if (!m.alive) return;
    m.x += m.vx * m.dir;
    if (m.x < m.startX || m.x > m.startX + m.range) m.dir *= -1;

    const mRect = {x: m.x, y: m.y, w: m.w, h: m.h};

    if (player.vy > 0 && player.y + player.h - player.vy <= m.y + 4 && rectIntersect(playerRect, mRect)) {
      m.alive = false;
      player.vy = JUMP_FORCE * 0.7;
      sfxStomp();
      score += 200;
      spawnParticles(m.x + m.w / 2, m.y + m.h / 2, '#2ecc71', 6);
      updateHUD();
      return;
    }

    if (rectIntersect(playerRect, mRect) && player.invuln <= 0) {
      killPlayer();
    }
  });

  entities.particles = entities.particles.filter(p => p.life > 0);
  entities.particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  if (player.invuln > 0) player.invuln--;
}

function killPlayer() {
  if (!player.alive) return;
  player.alive = false;
  sfxHit();
  setTimeout(() => sfxGameOver(), 300);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff4444', 10);
  setTimeout(() => {
    gameState = STATE_GAMEOVER;
    showScreen('gameoverScreen');
    document.getElementById('finalScore').textContent = `Skor Akhir: ${score}`;
    saveScore(score);
  }, 800);
}
function saveScore(finalScore) {
  if (!username) username = 'PLAYER';
  localStorage.setItem('arcade_last_username', username);
  const board = JSON.parse(localStorage.getItem('arcade_leaderboard') || '[]');
  board.push({
    id: 'run_' + Date.now(),
    username: sanitize(username),
    score: finalScore,
    timestamp: Date.now(),
    date: new Date().toLocaleString('id-ID', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'})
  });
  board.sort((a, b) => b.score - a.score);
  localStorage.setItem('arcade_leaderboard', JSON.stringify(board.slice(0, 10)));
}

function sanitize(str) {
  return String(str).replace(/[<>&"']/g, '').trim();
}

function renderLeaderboard() {
  const board = JSON.parse(localStorage.getItem('arcade_leaderboard') || '[]');
  const tbody = document.getElementById('leaderboardBody');
  tbody.innerHTML = '';
  board.forEach((e, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td>${escapeHtml(e.username)}</td><td>${e.score}</td><td>${e.date}</td>`;
    tbody.appendChild(tr);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showScreen(id) {
  document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function updateHUD() {
  document.getElementById('hudScore').textContent = `SCORE: ${score}`;
  document.getElementById('hudCoins').textContent = `COIN: ${coins}`;
}
/* ============================================================
   7. RENDERING & UI
   ============================================================ */
function drawPixel(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 1);
}

function drawBlock(b) {
  const sx = b.x - cameraX;
  if (sx + TILE < 0 || sx > INTERNAL_W) return;

  if (b.type === 'grass') {
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(sx, b.y, TILE, 2);
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(sx, b.y + 2, TILE, 1);
    ctx.fillStyle = '#ffe4b5';
    ctx.fillRect(sx, b.y + 3, TILE, TILE - 3);
    ctx.fillStyle = '#d2b48c';
    ctx.fillRect(sx, b.y + 6, TILE, 1);
    ctx.fillRect(sx, b.y + 12, TILE, 1);
  } else if (b.type === 'dirt') {
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(sx, b.y, TILE, TILE);
    ctx.fillStyle = '#a0522d';
    ctx.fillRect(sx, b.y, TILE, 2);
  }
}

function drawCoin(c) {
  if (c.collected) return;
  const sx = c.x - cameraX;
  if (sx + c.w < 0 || sx > INTERNAL_W) return;
  const bounce = Math.sin(frameCount * 0.15 + c.offset) * 2;
  const cy = c.y + bounce;
  const cx = sx + c.w / 2;
  const cyy = cy + c.h / 2;

  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(cx, cyy, c.w / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx - c.w / 4, cyy - c.h / 4, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawMonster(m) {
  const sx = m.x - cameraX;
  if (sx + m.w < 0 || sx > INTERNAL_W) return;
  const cy = m.y;

  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(sx + 2, cy + 4, m.w - 4, m.h - 4);
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(sx + 2, cy + 4, m.w - 4, 2);

  ctx.fillStyle = '#fff';
  ctx.fillRect(sx + 3, cy + 6, 3, 3);
  ctx.fillRect(sx + m.w - 6, cy + 6, 3, 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(sx + 4, cy + 7, 1, 1);
  ctx.fillRect(sx + m.w - 5, cy + 7, 1, 1);

  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(sx + 2, cy + m.h - 2, 3, 2);
  ctx.fillRect(sx + m.w - 5, cy + m.h - 2, 3, 2);
}

function drawPlayer(p) {
  if (!p.alive && frameCount % 10 < 5) return;
  const sx = p.x - cameraX;
  if (sx + p.w < 0 || sx > INTERNAL_W) return;

  const px = sx;
  const py = p.y;

  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(px + 2, py + 2, 8, 6);
  ctx.fillRect(px + 1, py + 5, 1, 4);
  ctx.fillRect(px + 10, py + 5, 1, 4);
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(px + 4, py + 3, 1, 1);
  ctx.fillRect(px + 6, py + 3, 1, 1);

  ctx.fillStyle = '#f5d7b2';
  ctx.fillRect(px + 2, py + 8, 8, 6);
  ctx.fillRect(px + 2, py + 6, 1, 3);
  ctx.fillRect(px + 10, py + 6, 1, 3);

  ctx.fillStyle = '#000';
  if (p.dir > 0) {
    ctx.fillRect(px + 7, py + 9, 2, 2);
    ctx.fillRect(px + 4, py + 10, 1, 1);
  } else {
    ctx.fillRect(px + 4, py + 9, 2, 2);
    ctx.fillRect(px + 9, py + 10, 1, 1);
  }

  ctx.fillStyle = '#333';
  ctx.fillRect(px + 6, py + 11, 1, 1);

  ctx.fillStyle = '#2980b9';
  ctx.fillRect(px + 1, py + 14, 10, 8);
  ctx.fillRect(px + 0, py + 16, 12, 6);

  ctx.fillStyle = '#8b4513';
  ctx.fillRect(px + 0, py + 22, 4, 2);
  ctx.fillRect(px + 8, py + 22, 4, 2);

  ctx.fillStyle = '#f5d7b2';
  ctx.fillRect(px - 1, py + 16, 2, 2);
  ctx.fillRect(px + 11, py + 16, 2, 2);
}

function drawParticles() {
  entities.particles.forEach(p => {
    const alpha = p.life / 40;
    ctx.globalAlpha = alpha > 0 ? alpha : 0;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cameraX, p.y, 2, 2);
    ctx.globalAlpha = 1;
  });
}

function drawSky() {
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

  const cloudOffset = (frameCount * 0.1) % (INTERNAL_W + 120);
  for (let cx = -120; cx < INTERNAL_W + 120; cx += 100) {
    const dx = (cx + cloudOffset) % (INTERNAL_W + 120) - 60;
    if (dx < 0 || dx > INTERNAL_W) continue;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(dx, 30, 30, 4);
    ctx.fillRect(dx + 4, 26, 22, 6);
    ctx.fillRect(dx + 8, 22, 14, 6);
  }
}

function drawGroundDecoration() {
  const flowerX = [40, 180, 320, 500, 720, 960, 1180];
  flowerX.forEach(x => {
    const sx = x - cameraX;
    if (sx < 0 || sx > INTERNAL_W) return;
    ctx.fillStyle = '#ff69b4';
    ctx.fillRect(sx, GROUND_Y - 2, 2, 2);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(sx + 1, GROUND_Y - 1, 1, 1);
  });
}

function draw() {
  drawSky();
  drawGroundDecoration();

  entities.blocks.forEach(drawBlock);
  entities.coins.forEach(drawCoin);
  entities.monsters.forEach(drawMonster);
  drawParticles();
  drawPlayer(player);

  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.strokeRect(0 - cameraX, 0, LEVEL_WIDTH, INTERNAL_H);
}

/* ============================================================
   8. MAIN GAME LOOP
   ============================================================ */
function loop() {
  frameCount++;
  if (gameState === STATE_PLAYING) {
    updatePhysics();
    draw();
  } else if (gameState === STATE_MENU) {
    draw();
  }
  requestAnimationFrame(loop);
}
/* UI Event Listeners */
document.getElementById('btnStart').addEventListener('click', () => {
  const input = document.getElementById('inputUsername');
  let name = input.value.trim() || localStorage.getItem('arcade_last_username') || 'PLAYER';
  if (name.length > 15) name = name.slice(0, 15);
  username = sanitize(name);
  input.value = username;
  document.getElementById('btnChangeName').style.display = 'inline-block';
  localStorage.setItem('arcade_last_username', username);
  resetGame();
  gameState = STATE_PLAYING;
  document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
  updateHUD();
});

document.getElementById('btnChangeName').addEventListener('click', () => {
  document.getElementById('inputUsername').focus();
});

document.getElementById('btnRetry').addEventListener('click', () => {
  resetGame();
  gameState = STATE_PLAYING;
  document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
  updateHUD();
});

document.getElementById('btnMenu').addEventListener('click', () => {
  gameState = STATE_MENU;
  showScreen('menuScreen');
});

document.getElementById('btnLeaderboardMenu').addEventListener('click', () => {
  gameState = STATE_MENU;
  showScreen('menuScreen');
});

// Inisialisasi awal
buildLevel();
draw();
updateHUD();
showScreen('menuScreen');

if (username) {
  document.getElementById('inputUsername').value = username;
  document.getElementById('btnChangeName').style.display = 'inline-block';
}

loop();
</script>
